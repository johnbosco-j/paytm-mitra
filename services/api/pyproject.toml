[project]
name = "mitra-api"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime packages (what Vercel installs). requirements.txt adds the dev tools on top for local work.
dependencies = [
  "alembic==1.20.1", "bcrypt==5.0.0", "cryptography==50.0.2", "email-validator==2.3.0", "fastapi==0.162.5",
  "httpx==0.28.1", "paytmchecksum==1.7.0", "psycopg==3.3.9", "psycopg-binary==3.3.9", "pycryptodome==4.4.0",
  "pydantic==2.14.3", "pydantic-settings==2.16.2", "pyjwt==2.15.1", "python-multipart==0.0.33", "sqlalchemy==2.1.8",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]  # B008: FastAPI Depends() idiom; RUF00x: ₹ and Tamil text are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
